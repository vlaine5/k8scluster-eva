# Un Service donne une adresse stable (et un nom DNS : nginx.demo.svc) à un
# ensemble de Pods, et répartit le trafic entre eux.
#   kubectl apply -f examples/service.yaml
#   kubectl -n demo get service nginx
#   kubectl -n demo port-forward service/nginx 8080:80   puis http://localhost:8080
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: demo
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: http
