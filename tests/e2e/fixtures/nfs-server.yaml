# Serveur NFS de TEST dans le cluster (CI uniquement) : jamais pour de vraies données.
# Image officielle des tests e2e de Kubernetes (export /exports, NFSv4 fsid=0).
apiVersion: v1
kind: Namespace
metadata:
  name: nfs-test
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server
  namespace: nfs-test
spec:
  replicas: 1
  selector:
    matchLabels: {app: nfs-server}
  template:
    metadata:
      labels: {app: nfs-server}
    spec:
      containers:
        - name: nfs-server
          image: registry.k8s.io/volume-nfs:0.8
          securityContext:
            privileged: true
          ports:
            - {name: nfs, containerPort: 2049}
            - {name: mountd, containerPort: 20048}
            - {name: rpcbind, containerPort: 111}
          volumeMounts:
            - {name: exports, mountPath: /exports}
      volumes:
        - name: exports
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server
  namespace: nfs-test
spec:
  selector: {app: nfs-server}
  ports:
    - {name: nfs, port: 2049}
    - {name: mountd, port: 20048}
    - {name: rpcbind, port: 111}
