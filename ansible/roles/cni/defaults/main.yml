---
# Dossier (sur le control-plane) où sont conservés les manifestes appliqués.
cni_addons_dir: /etc/kubernetes/addons

# kubeconfig utilisé pour installer le CNI (admin du 1er control-plane).
cni_kubeconfig: /etc/kubernetes/admin.conf
cni_helm_binary: /usr/local/bin/helm
cni_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture'] | default('x86_64')] }}"

# Adresse de l'API vue par le CNI (Cilium sans kube-proxy, Calico).
cni_api_host: "{{ k8s_api_host }}"
cni_api_port: "{{ k8s_api_port }}"

# --- Flannel ------------------------------------------------------------------
# Manifeste officiel d'une release ÉPINGLÉE (jamais la branche master).
cni_flannel_manifest_url: "{{ lab_lock.components.flannel.url | replace('{version}', k8s_cni_version) }}"

# DaemonSets caractéristiques de chaque CNI (détection d'un CNI déjà installé).
cni_signatures:
  kube-flannel-ds: flannel
  calico-node: calico
  cilium: cilium
