---
# Flannel : https://github.com/flannel-io/flannel
# Le manifeste officiel est téléchargé (version épinglée + SHA-256 vérifié),
# puis adapté avec Kustomize (intégré à kubectl) : CIDR des Pods, backend et
# interface réseau. Les fichiers restent lisibles dans {{ cni_addons_dir }}/flannel.
# Flannel n'applique AUCUNE NetworkPolicy (docs/cni.md).

- name: Check that the checksum of the requested Flannel version is known
  ansible.builtin.assert:
    that: k8s_cni_version in lab_lock.components.flannel.sha256
    fail_msg: >-
      No known SHA-256 checksum for Flannel {{ k8s_cni_version }}. Add it to
      components.flannel.sha256 (config/versions.yaml) after verifying it:
      curl -sSL {{ cni_flannel_manifest_url }} | sha256sum
    quiet: true

- name: Check the Flannel backend
  ansible.builtin.assert:
    that: k8s_cni_mode in ['vxlan', 'host-gw']
    fail_msg: "CNI_MODE={{ k8s_cni_mode }} is not a Flannel backend (vxlan, host-gw)."
    quiet: true

- name: Create the Flannel addon directory
  ansible.builtin.file:
    path: "{{ cni_addons_dir }}/flannel"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Download the official Flannel manifest (checksum verified)
  ansible.builtin.get_url:
    url: "{{ cni_flannel_manifest_url }}"
    dest: "{{ cni_addons_dir }}/flannel/kube-flannel-{{ k8s_cni_version }}.yml"
    checksum: "sha256:{{ lab_lock.components.flannel.sha256[k8s_cni_version] }}"
    owner: root
    group: root
    mode: "0644"

- name: Write the Kustomize overlay (Pod CIDR, backend and network interface)
  ansible.builtin.template:
    src: flannel/kustomization.yaml.j2
    dest: "{{ cni_addons_dir }}/flannel/kustomization.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Apply Flannel
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig={{ cni_kubeconfig }}
      - apply
      - --kustomize={{ cni_addons_dir }}/flannel
  register: cni_flannel_apply
  changed_when: cni_flannel_apply.stdout is search('(created|configured)')

- name: Wait for the Flannel DaemonSet to be ready
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig={{ cni_kubeconfig }}
      - --namespace=kube-flannel
      - rollout
      - status
      - daemonset/kube-flannel-ds
      - --timeout=300s
  changed_when: false
