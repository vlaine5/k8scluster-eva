---
# =============================================================================
#  Adresse stable de l'API Kubernetes : VIP portée par kube-vip (ARP, pod
#  statique sur chaque control-plane, élection d'un leader).
#
#  À NE PAS confondre avec MetalLB / Cilium LB : ceux-ci servent les Services
#  applicatifs et ne fonctionnent qu'une fois Kubernetes démarré ; la VIP de
#  l'API doit exister AVANT (kubeadm init l'utilise déjà).
#
#  Particularité kubeadm >= 1.29 : pendant "kubeadm init", admin.conf n'a pas
#  encore ses droits ; kube-vip utilise alors super-admin.conf sur le 1er
#  control-plane, puis repasse sur admin.conf (api_endpoint_phase=after-init).
#  https://kube-vip.io/docs/installation/static/
# =============================================================================

- name: Find the network interface that carries the node IP
  ansible.builtin.set_fact:
    api_endpoint_interface: >-
      {{ ansible_facts['interfaces'] | map('regex_replace', '-', '_')
         | map('extract', ansible_facts) | selectattr('ipv4', 'defined')
         | selectattr('ipv4.address', 'equalto', k8s_node_ip) | map(attribute='device') | first | default('') }}

- name: Check that the interface of the node IP was found
  ansible.builtin.assert:
    that: api_endpoint_interface | length > 0
    fail_msg: "No interface of {{ inventory_hostname }} carries {{ k8s_node_ip }}: kube-vip cannot announce the VIP."
    quiet: true

- name: Choose the kubeconfig used by kube-vip
  ansible.builtin.set_fact:
    api_endpoint_kubeconfig: >-
      {{ '/etc/kubernetes/super-admin.conf'
         if (inventory_hostname == k8s_control_plane_host and api_endpoint_phase == 'before-init')
         else '/etc/kubernetes/admin.conf' }}

- name: Create the static Pod directory
  ansible.builtin.file:
    path: /etc/kubernetes/manifests
    state: directory
    owner: root
    group: root
    mode: "0755"

# Conteneur kube-vip en cours avant l'écriture du manifeste : sert à détecter son
# remplacement par kubelet (voir plus bas).
- name: Find the running kube-vip container
  ansible.builtin.command:
    argv: [crictl, ps, --name, kube-vip, --state, running, --quiet]
  register: api_endpoint_old_container
  changed_when: false
  failed_when: false

- name: Write the kube-vip static Pod
  ansible.builtin.template:
    src: kube-vip.yaml.j2
    dest: /etc/kubernetes/manifests/kube-vip.yaml
    owner: root
    group: root
    mode: "0600"
  register: api_endpoint_manifest

# Quand le manifeste change, kubelet relit le dossier quelques secondes plus tard, arrête
# kube-vip puis le relance : la VIP disparaît entre-temps. On attend donc d'abord que le
# conteneur ait été REMPLACÉ (attendre seulement la VIP passait avant même l'arrêt), puis
# que l'API réponde par la VIP. kube-vip joint l'API locale (alias « kubernetes » ->
# 127.0.0.1) : il reprend la VIP seul.
- name: Wait until kubelet runs kube-vip with the new manifest
  ansible.builtin.command:
    argv: [crictl, ps, --name, kube-vip, --state, running, --quiet]
  register: api_endpoint_new_container
  changed_when: false
  failed_when: false
  until:
    - api_endpoint_new_container.stdout | trim | length > 0
    - api_endpoint_new_container.stdout | trim != api_endpoint_old_container.stdout | default('') | trim
  retries: 24
  delay: 5
  when:
    - api_endpoint_manifest is changed
    - api_endpoint_phase == 'after-init'

- name: Wait until the API answers on the VIP again
  ansible.builtin.command:
    argv: [kubectl, --kubeconfig=/etc/kubernetes/admin.conf, get, --raw=/readyz]
  register: api_endpoint_readyz
  changed_when: false
  failed_when: false
  until: api_endpoint_readyz.rc == 0
  retries: 36
  delay: 5
  when:
    - api_endpoint_manifest is changed
    - api_endpoint_phase == 'after-init'

- name: Check that kube-vip was restarted and that the VIP answers
  ansible.builtin.assert:
    that: >-
      api_endpoint_readyz is skipped
      or (api_endpoint_readyz.rc == 0
          and api_endpoint_new_container.stdout | trim != api_endpoint_old_container.stdout | default('') | trim)
    fail_msg: >-
      kube-vip was not restarted with its new manifest on {{ inventory_hostname }}, or the API does not answer on
      {{ k8s_api_endpoint }}: {{ api_endpoint_readyz.stderr | default('') | trim | truncate(500) }}.
      Check kube-vip: sudo crictl ps -a --name kube-vip, then sudo crictl logs <id>
      (docs/high-availability.md). Nothing was reset.
    quiet: true
