---
# =============================================================================
#  Installation du runtime de conteneurs (containerd 2.x, paquet containerd.io).
#  https://kubernetes.io/docs/setup/production-environment/container-runtimes/
#  L'installation dépend de la famille (APT / DNF) ; la configuration est commune.
# =============================================================================

- name: Check that the requested container runtime is supported
  ansible.builtin.assert:
    that: container_runtime == "containerd"
    fail_msg: >-
      container_runtime={{ container_runtime }} is not supported. Only "containerd" is
      implemented (to add CRI-O, create roles/container_runtime/tasks/install-crio-<family>.yml).
    quiet: true

- name: Check that the CPU architecture is supported
  ansible.builtin.assert:
    that: ansible_facts['architecture'] in container_runtime_arch_map
    fail_msg: "Unsupported architecture: {{ ansible_facts['architecture'] }}"
    quiet: true

- name: Install containerd for the family {{ k8s_os_family }}
  ansible.builtin.include_tasks: "install-{{ k8s_os_family }}.yml"

- name: Create the containerd configuration directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure containerd (systemd cgroup driver, sandbox image)
  ansible.builtin.template:
    src: config.toml.j2
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"
  notify: Restart containerd

- name: Configure crictl
  ansible.builtin.template:
    src: crictl.yaml.j2
    dest: /etc/crictl.yaml
    owner: root
    group: root
    mode: "0644"

- name: Enable and start containerd
  ansible.builtin.systemd_service:
    name: containerd
    enabled: true
    state: started

# Applique tout de suite une éventuelle nouvelle configuration : kubeadm
# doit trouver un containerd correctement configuré.
- name: Apply pending containerd restarts
  ansible.builtin.meta: flush_handlers

- name: Read the effective containerd configuration
  ansible.builtin.command:
    argv: [containerd, config, dump]
  register: container_runtime_config_dump
  changed_when: false

- name: Check the effective containerd configuration
  ansible.builtin.assert:
    that:
      - "'SystemdCgroup = ' ~ (container_runtime_systemd_cgroup | bool | lower) in container_runtime_config_dump.stdout"
      - "container_runtime_sandbox_image in container_runtime_config_dump.stdout"
      - "'disabled_plugins = []' in container_runtime_config_dump.stdout"
    fail_msg: >-
      containerd does not use the expected configuration. Run
      'sudo containerd config dump' on {{ inventory_hostname }} to investigate.
    quiet: true
