---
# Dépôt APT officiel de Docker : il fournit le paquet containerd.io (containerd 2.x
# + runc), maintenu et mis à jour pour Ubuntu et Debian.
# Doc : https://github.com/containerd/containerd/blob/main/docs/getting-started.md
container_runtime_repo_url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}"
container_runtime_repo_key_url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"

# Image "pause" (sandbox des Pods) : doit correspondre à celle attendue par
# kubeadm (voir : kubeadm config images list).
container_runtime_sandbox_image: "registry.k8s.io/pause:3.10.2"

# Le kubelet utilise le driver cgroup "systemd" (défaut kubeadm) : containerd
# doit utiliser le même, sinon les Pods deviennent instables.
container_runtime_systemd_cgroup: true

# TOML brut ajouté à la fin de /etc/containerd/config.toml (usage avancé :
# miroir de registre, runtime supplémentaire...). Vide par défaut.
container_runtime_extra_config: ""

# Correspondance architecture Ansible -> architecture Debian.
container_runtime_arch_map:
  x86_64: amd64
  aarch64: arm64
