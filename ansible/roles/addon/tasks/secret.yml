---
# Secret Kubernetes construit à partir de .env (valeur « env:VAR ») ou de la
# configuration (« cfg:VAR »). Créé seulement si les variables « only_if_env »
# sont définies. no_log : la valeur n'apparaît jamais dans la sortie d'Ansible.
- name: Check whether .env configures the secret {{ addon_secret.name }}
  ansible.builtin.set_fact:
    # only_if_env : toutes ces variables doivent être définies ; only_if_any_env : au moins une.
    addon_secret_enabled: >-
      {{ (query('ansible.builtin.env', *(addon_secret.only_if_env | default([]))) | select | list | length
          == addon_secret.only_if_env | default([]) | length)
         and (addon_secret.only_if_any_env is not defined
              or query('ansible.builtin.env', *addon_secret.only_if_any_env) | select | list | length > 0) }}
    addon_secret_string_data: {}
  no_log: true

- name: Resolve the values of the secret {{ addon_secret.name }}
  ansible.builtin.set_fact:
    addon_secret_string_data: "{{ addon_secret_string_data | combine({item.key: addon_secret_value}) }}"
  loop: "{{ addon_secret.data | dict2items }}"
  vars:
    addon_secret_value: >-
      {{ lookup('ansible.builtin.env', item.value[4:]) if (item.value is string and item.value.startswith('env:'))
         else ((cfg[item.value[4:]] | default('')) if (item.value is string and item.value.startswith('cfg:')) else item.value) }}
  no_log: true
  when: addon_secret_enabled | bool

- name: Format an AWS credentials file
  ansible.builtin.set_fact:
    addon_secret_string_data: >-
      {{ {addon_secret.key: '[default]\naws_access_key_id=' ~ addon_secret_string_data.aws_access_key_id
          ~ '\naws_secret_access_key=' ~ addon_secret_string_data.aws_secret_access_key ~ '\n'} }}
  no_log: true
  when:
    - addon_secret_enabled | bool
    - addon_secret.format | default('') == 'aws-credentials-file'

- name: Create or update the secret {{ addon_secret.name }}
  kubernetes.core.k8s:
    kubeconfig: "{{ addon_kubeconfig }}"
    context: "{{ addon_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: "{{ addon_secret.name }}"
        namespace: "{{ addon_secret.namespace }}"
        labels: "{{ addon_namespace_labels | combine(addon_secret.labels | default({})) }}"
      stringData: "{{ addon_secret_string_data | dict2items | rejectattr('value', 'equalto', '') | items2dict }}"
  no_log: true
  when: addon_secret_enabled | bool
