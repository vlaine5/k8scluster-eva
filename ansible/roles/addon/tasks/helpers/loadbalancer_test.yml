---
# Test commun aux fournisseurs LoadBalancer (MetalLB, Cilium LB IPAM) :
# une IP du pool est attribuée, le Service répond dans le cluster et depuis votre poste.
- name: Deploy an echo application behind a LoadBalancer Service
  kubernetes.core.k8s:
    kubeconfig: "{{ addon_kubeconfig }}"
    context: "{{ addon_context }}"
    state: present
    wait: true
    wait_timeout: 300
    definition:
      - apiVersion: apps/v1
        kind: Deployment
        metadata: {name: echo, namespace: "{{ addon_test_ns }}"}
        spec:
          replicas: 1
          selector: {matchLabels: {app: echo}}
          template:
            metadata: {labels: {app: echo}}
            spec:
              containers:
                - name: echo
                  image: "{{ lab_test_images.echo }}"
                  args: [netexec, --http-port=8080]
                  readinessProbe: {httpGet: {path: /hostname, port: 8080}}
      - apiVersion: v1
        kind: Service
        metadata: {name: echo-lb, namespace: "{{ addon_test_ns }}"}
        spec:
          type: LoadBalancer
          selector: {app: echo}
          ports: [{port: 80, targetPort: 8080}]

- name: Wait for an external IP
  ansible.builtin.command:
    argv: "{{ addon_kubectl + ['-n', addon_test_ns, 'get', 'service', 'echo-lb', '-o', 'jsonpath={.status.loadBalancer.ingress[0].ip}'] }}"
  register: addon_lb_test_ip
  until: addon_lb_test_ip.stdout | length > 0
  retries: 30
  delay: 5
  changed_when: false

- name: Check that the IP belongs to LOADBALANCER_IP_POOL
  ansible.builtin.assert:
    that: addon_lb_test_ip.stdout in lab.loadbalancer.pool_ips
    fail_msg: "{{ addon_lb_test_ip.stdout }} is not in LOADBALANCER_IP_POOL ({{ lab.loadbalancer.pool | join(', ') }})."
    quiet: true
  when: lab.loadbalancer.pool_ips | default([]) | length > 0

- name: Call the LoadBalancer IP from inside the cluster
  ansible.builtin.include_tasks: "{{ addon_helpers }}/curl.yml"
  vars:
    addon_curl_label: LoadBalancer IP from a Pod
    addon_curl_args: ["http://{{ addon_lb_test_ip.stdout }}/hostname"]
    addon_curl_expect: echo-

- name: Call the LoadBalancer IP from this workstation (local network, ARP/BGP announcement)
  ansible.builtin.uri:
    url: "http://{{ addon_lb_test_ip.stdout }}/hostname"
    return_content: true
    timeout: 5
  register: addon_lb_test_lan
  until: addon_lb_test_lan.status == 200 and 'echo-' in addon_lb_test_lan.content
  retries: 24
  delay: 5
