---
# =============================================================================
#  Control-planes : le 1er initialise le cluster (kubeadm init), les suivants
#  le rejoignent (kubeadm join --control-plane), un à la fois.
#  https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/high-availability/
# =============================================================================

- name: Initialize the first control-plane
  ansible.builtin.include_tasks: init.yml
  when: inventory_hostname == k8s_control_plane_host

- name: Join an additional control-plane
  ansible.builtin.include_tasks: join.yml
  when: inventory_hostname != k8s_control_plane_host

- name: Create the .kube directory of the SSH user
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.kube"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    mode: "0700"

- name: Give kubectl access to the SSH user on the control-plane
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ ansible_facts['user_dir'] }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_facts['user_id'] }}"
    mode: "0600"

- name: Wait for the API server to answer
  ansible.builtin.command:
    argv: [kubectl, --kubeconfig=/etc/kubernetes/admin.conf, get, --raw=/readyz]
  register: control_plane_readyz
  until: control_plane_readyz.rc == 0
  retries: 60
  delay: 5
  changed_when: false

- name: Record that this node belongs to the lab cluster
  ansible.builtin.copy:
    dest: "{{ k8s_lab_marker }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (k8s-lab) : ne pas supprimer (protection contre un réemploi accidentel).
      cluster: {{ k8s_cluster_name }}
      role: control-plane
      api_endpoint: {{ k8s_api_endpoint }}
