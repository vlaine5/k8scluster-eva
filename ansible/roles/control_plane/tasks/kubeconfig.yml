---
# =============================================================================
#  Export du kubeconfig vers votre poste (le "contrôleur" Ansible).
#
#  Les noms génériques de kubeadm (cluster "kubernetes", utilisateur
#  "kubernetes-admin") sont renommés d'après le cluster pour pouvoir fusionner
#  plusieurs clusters dans un même fichier kubeconfig sans collision.
#  Le fichier contient un certificat administrateur : il est créé en 0600.
# =============================================================================

- name: Read the admin kubeconfig of the control-plane
  ansible.builtin.slurp:
    src: /etc/kubernetes/admin.conf
  register: control_plane_admin_kubeconfig
  no_log: true

- name: Build a kubeconfig with names unique to this cluster
  ansible.builtin.set_fact:
    control_plane_exported_kubeconfig:
      apiVersion: v1
      kind: Config
      preferences: {}
      clusters:
        - name: "{{ k8s_cluster_name }}"
          cluster: "{{ (control_plane_admin_kubeconfig.content | b64decode | from_yaml).clusters[0].cluster }}"
      users:
        - name: "{{ k8s_cluster_name }}-admin"
          user: "{{ (control_plane_admin_kubeconfig.content | b64decode | from_yaml).users[0].user }}"
      contexts:
        - name: "{{ k8s_cluster_name }}"
          context:
            cluster: "{{ k8s_cluster_name }}"
            user: "{{ k8s_cluster_name }}-admin"
      current-context: "{{ k8s_cluster_name }}"
  no_log: true

- name: Create the local kubeconfig directory
  ansible.builtin.file:
    path: "{{ kubeconfig_output_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Write the kubeconfig on the Ansible controller
  ansible.builtin.copy:
    content: "{{ control_plane_exported_kubeconfig | to_nice_yaml(indent=2) }}"
    dest: "{{ kubeconfig_output_dir }}/{{ k8s_cluster_name }}.yaml"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true

- name: Show how to use the kubeconfig
  ansible.builtin.debug:
    msg:
      - "kubeconfig written to {{ kubeconfig_output_dir | realpath }}/{{ k8s_cluster_name }}.yaml"
      - "Try: kubectl --kubeconfig {{ kubeconfig_output_dir | realpath }}/{{ k8s_cluster_name }}.yaml get nodes"
