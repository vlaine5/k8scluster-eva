---
# Ubuntu / Debian : fichier .sources (deb822) + clé de signature dédiée
# (/etc/apt/keyrings) au lieu de l'obsolète apt-key.
- name: Add the Kubernetes APT repository (pkgs.k8s.io)
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: [deb]
    uris: ["{{ kubernetes_repo_url_debian }}"]
    suites: ["/"]
    signed_by: "{{ kubernetes_repo_url_debian }}Release.key"
    state: present
  register: kubernetes_repo

- name: Install kubelet, kubeadm and kubectl at the requested version (APT)
  ansible.builtin.apt:
    name: "{{ kubernetes_packages | map('regex_replace', '$', '=' ~ kubernetes_version ~ '-*') | list }}"
    state: present
    update_cache: "{{ kubernetes_repo.changed }}"
    allow_change_held_packages: true

- name: Install the complementary tools (APT)
  ansible.builtin.apt:
    name: "{{ kubernetes_extra_packages }}"
    state: present

# Paquets "gelés" : une mise à jour de Kubernetes doit être un geste volontaire
# (make upgrade), jamais un effet de bord d'un apt upgrade.
- name: Hold the Kubernetes packages at their current version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ kubernetes_packages }}"
