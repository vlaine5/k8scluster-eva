---
# Paquets de base installés sur chaque nœud.
common_packages_debian:
  - ca-certificates
  - curl
  - gnupg
  - bash-completion
  - conntrack
  - socat
  - iproute2
  - jq
  # requis par le module Ansible deb822_repository
  - python3-debian
  # requis par kubernetes.core.helm (CNI installé depuis le 1er control-plane)
  - python3-yaml
common_packages_redhat:
  - ca-certificates
  - curl
  - gnupg2
  - bash-completion
  - conntrack-tools
  - socat
  - iproute
  - iproute-tc
  - jq
  - tar
  - python3-pyyaml

# Modules noyau requis par containerd (overlay) et par le réseau des Pods
# (br_netfilter : le trafic des bridges Linux passe par iptables).
common_kernel_modules:
  - overlay
  - br_netfilter

# Paramètres réseau exigés par Kubernetes :
# https://kubernetes.io/docs/setup/production-environment/container-runtimes/#prerequisite-ipv4-forwarding-optional
common_sysctl_settings:
  net.ipv4.ip_forward: "1"
  net.bridge.bridge-nf-call-iptables: "1"
  net.bridge.bridge-nf-call-ip6tables: "1"

# Désactive le swap (le kubelet refuse de démarrer si le swap est actif,
# sauf failSwapOn: false). À ne passer à false que si le swap est hors de
# portée du nœud (conteneur de test partageant le swap de l'hôte).
common_disable_swap: true

# Nom d'hôte et /etc/hosts : gérés pour les VMs créées par le lab, jamais
# modifiés sur des machines existantes (mode existing).
common_manage_hostname: "{{ lab_platform != 'existing' }}"
common_manage_etc_hosts: "{{ lab_platform != 'existing' }}"

# Ports ouverts dans un pare-feu actif (firewalld / ufw), selon le rôle du nœud,
# le CNI et les addons. Liste officielle : https://kubernetes.io/docs/reference/networking/ports-and-protocols/
common_ports_control_plane: [6443/tcp, 2379-2380/tcp, 10250/tcp, 10257/tcp, 10259/tcp, 2381/tcp]
common_ports_worker: [10250/tcp, 10256/tcp, 30000-32767/tcp, 30000-32767/udp]
common_ports_cni:
  flannel: [8472/udp]
  calico: [179/tcp, 4789/udp, 5473/tcp]
  cilium: [8472/udp, 6081/udp, 4240/tcp, 4244/tcp]
  none: []
common_firewall_ports: >-
  {{ (common_ports_control_plane if inventory_hostname in groups['control_plane'] else [])
     + common_ports_worker
     + common_ports_cni[cni] | default([])
     + ['9100/tcp', '10249/tcp']
     + (node_prereqs.firewall_ports | default([]) | map(attribute='port') | map('string')
        | zip(node_prereqs.firewall_ports | default([]) | map(attribute='proto')) | map('join', '/') | list) }}
