---
# =============================================================================
#  Préparation du système d'exploitation de chaque nœud (Ubuntu, Debian, Rocky).
#  Les tâches propres à une famille sont dans packages-<famille>.yml,
#  firewall-<outil>.yml et security-<famille>.yml ; le reste est commun.
#  Les contrôles (OS supporté, cgroup v2, ressources...) sont faits avant,
#  par le rôle preflight.
# =============================================================================

- name: Check that the operating system family is supported
  ansible.builtin.assert:
    that:
      - k8s_os_family in ['debian', 'redhat']
      - ansible_facts['service_mgr'] == "systemd"
    fail_msg: >-
      {{ inventory_hostname }} runs {{ ansible_facts['distribution'] }} ({{ ansible_facts['os_family'] }}):
      only Debian-family (Ubuntu, Debian) and RedHat-family (Rocky Linux) systems with systemd are supported.
    quiet: true

- name: Set the hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  when: common_manage_hostname | bool

- name: Declare every cluster node in /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} k8s-lab nodes (managed by Ansible)"
    mode: "0644"
    block: |
      {% for host in groups['k8s_cluster'] %}
      {{ hostvars[host]['k8s_node_ip'] }} {{ host }}
      {% endfor %}
  when: common_manage_etc_hosts | bool

- name: Install the base packages of the family {{ k8s_os_family }}
  ansible.builtin.include_tasks: "packages-{{ k8s_os_family }}.yml"

# --- Swap --------------------------------------------------------------------
# Par défaut, le kubelet refuse de démarrer si le swap est actif.
- name: Disable swap for the current boot
  ansible.builtin.command:
    argv: [swapoff, --all]
  when:
    - common_disable_swap | bool
    - node_swap == 'disable'
    - ansible_facts['swaptotal_mb'] | int > 0
  changed_when: true

- name: Disable swap permanently (comment swap entries in /etc/fstab)
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#\s]+\s+\S+\s+swap\s+.*)$'
    replace: '# \1  # disabled for Kubernetes'
  when:
    - common_disable_swap | bool
    - node_swap == 'disable'

# --- Modules noyau et sysctl -------------------------------------------------
# Certains noyaux minimalistes (microVM, noyaux cloud) n'ont pas de modules
# chargeables : overlay et br_netfilter y sont alors intégrés au noyau.
- name: Check whether the kernel supports loadable modules
  ansible.builtin.stat:
    path: /proc/modules
  register: common_proc_modules

- name: Load the kernel modules now and at every boot
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop: "{{ common_kernel_modules }}"
  when: common_proc_modules.stat.exists

- name: Check that the bridge netfilter support is available
  ansible.builtin.stat:
    path: /proc/sys/net/bridge/bridge-nf-call-iptables
  register: common_br_netfilter

- name: Fail with an explanation when br_netfilter is missing
  ansible.builtin.assert:
    that: common_br_netfilter.stat.exists
    fail_msg: >-
      br_netfilter is not available on {{ inventory_hostname }}: the Pod network cannot work.
      Load the module (modprobe br_netfilter) or use a kernel that includes it.
    quiet: true

- name: Configure the kernel network parameters required by Kubernetes
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    sysctl_set: true
    reload: true
    state: present
  loop: "{{ common_sysctl_settings | dict2items }}"

# --- Sécurité : SELinux / AppArmor, jamais désactivés -----------------------------
- name: Configure the mandatory access control of the family {{ k8s_os_family }}
  ansible.builtin.include_tasks: "security-{{ k8s_os_family }}.yml"

# --- Pare-feu : seuls les ports nécessaires sont ouverts --------------------------
- name: Detect firewalld
  ansible.builtin.command:
    argv: [systemctl, is-active, firewalld]
  register: common_firewalld
  changed_when: false
  failed_when: false

# ufw.service est « active » même quand ufw est désactivé : on lit son vrai état.
- name: Detect ufw
  ansible.builtin.command:
    argv: [ufw, status]
  register: common_ufw
  changed_when: false
  failed_when: false
  when: k8s_os_family == 'debian'

- name: Record the active firewalls
  ansible.builtin.set_fact:
    common_active_firewalls: >-
      {{ (['firewalld'] if common_firewalld.stdout | default('') == 'active' else [])
         + (['ufw'] if 'Status: active' in common_ufw.stdout | default('') else []) }}

- name: Open the Kubernetes and CNI ports in the active firewall
  ansible.builtin.include_tasks: "firewall-{{ item }}.yml"
  loop: "{{ common_active_firewalls }}"
  when: node_firewall != 'unmanaged'

- name: Remind that no firewall rule was managed
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: NODE_FIREWALL=unmanaged and a firewall is active: open the Kubernetes ports
      yourself (docs/security.md#pare-feu), or the cluster will not work.
  when:
    - node_firewall == 'unmanaged'
    - common_active_firewalls | length > 0

# --- Témoin d'appartenance au cluster du lab --------------------------------------
- name: Create the k8s-lab state directory
  ansible.builtin.file:
    path: "{{ k8s_lab_marker | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
