---
# =============================================================================
#  Addons : installation, état, tests, désinstallation — depuis VOTRE poste,
#  par l'API Kubernetes (kubeconfig + contexte), quelle que soit la plateforme.
#
#  Lancé par ./k8s-lab (make addons-apply / addons-status / addons-test /
#  addons-remove) avec les variables résolues par scripts/labctl :
#    ansible-playbook addons.yml -e @.lab/ansible/<contexte>-vars.json -e addon_action=apply
#
#  Ordre : celui calculé par le résolveur (dépendances puis phases 5 à 8).
#  Désinstallation : ordre inverse, addons explicitement nommés uniquement.
# =============================================================================

- name: Manage the addons of the cluster
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    addon_action: apply
    # Restreindre à certains addons (ADDON=nom1,nom2) ; vide = tous ceux du plan.
    addon_only: ""
    addon_selection: >-
      {{ lab_addons | selectattr('id', 'in', addon_only.split(',')) | list if addon_only | length > 0 else lab_addons }}
  tasks:
    - name: Check the requested action
      ansible.builtin.assert:
        that:
          - addon_action in ['apply', 'status', 'test', 'remove']
          - addon_action != 'remove' or addon_only | length > 0
          - addon_only | length == 0 or addon_selection | length == addon_only.split(',') | length
        fail_msg: >-
          addon_action must be apply, status, test or remove; remove needs an explicit list (addon_only=...);
          every name in addon_only must be part of the resolved plan ({{ lab_addon_ids | join(', ') }}).
        quiet: true

    - name: Check that the cluster answers with the expected context
      ansible.builtin.command:
        argv: [kubectl, "--kubeconfig={{ lab.kubeconfig }}", "--context={{ lab.kube_context }}", version, -o, json]
      register: addons_cluster
      changed_when: false

    - name: Show the target cluster
      ansible.builtin.debug:
        msg: >-
          {{ addon_action }} on context {{ lab.kube_context }} (Kubernetes
          {{ (addons_cluster.stdout | from_json).serverVersion.gitVersion }}, platform {{ lab.platform }}) :
          {{ addon_selection | map(attribute='id') | join(', ') or 'no addon' }}

    - name: Run the action on each addon
      ansible.builtin.include_role:
        name: addon
      loop: "{{ addon_selection | reverse | list if addon_action == 'remove' else addon_selection }}"
      loop_control:
        loop_var: addon_item
        label: "{{ addon_item.id }}"

    - name: Set the default StorageClass
      ansible.builtin.include_role:
        name: addon
        tasks_from: storage_default.yml
      when:
        - addon_action == 'apply'
        - lab.default_storage_class.backend | default('platform') in ['nfs-csi', 'longhorn']
        - lab.default_storage_class.backend in lab_addon_ids

    - name: Report the status of the addons
      ansible.builtin.debug:
        msg: "{{ addon_status_report | default([]) }}"
      when: addon_action == 'status'

    - name: Report the functional tests
      ansible.builtin.debug:
        msg: >-
          {{ addon_test_report | default([]) | map(attribute='addon')
             | zip(addon_test_report | default([]) | map(attribute='result')) | map('join', ' : ') | list }}
      when: addon_action == 'test'

    - name: Write the test report for ./k8s-lab
      ansible.builtin.copy:
        dest: "{{ addon_report_file }}"
        content: "{{ {'action': addon_action, 'context': lab.kube_context, 'tests': addon_test_report | default([]),
                     'status': addon_status_report | default([]), 'health': addon_health_report | default([])} | to_nice_json }}"
        mode: "0600"
      # Rapport local pour le CLI : ne modifie pas le cluster (idempotence vérifiée en CI).
      changed_when: false
      when: addon_report_file is defined

    - name: Fail when a functional test failed
      ansible.builtin.assert:
        that: addon_test_report | default([]) | selectattr('result', 'equalto', 'ÉCHEC') | list | length == 0
        fail_msg: >-
          Failed tests: {{ addon_test_report | default([]) | selectattr('result', 'equalto', 'ÉCHEC')
          | map(attribute='addon') | join(', ') }}. Details above (namespace kept with addon_keep_test_resources=true).
        quiet: true
      when: addon_action == 'test'
