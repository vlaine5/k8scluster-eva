# Exemple d'inventaire écrit à la main (pour des VMs déjà existantes).
#
# En temps normal, vous n'écrivez PAS ce fichier : il est généré
#   - par Terraform  -> inventories/terraform-<provider>.ini
#   - par Vagrant    -> inventories/vagrant.ini
#
# Utilisation manuelle :
#   cd ansible
#   ansible-playbook -i inventories/example.ini site.yml

[control_plane]
k8s-cp-1 ansible_host=192.0.2.10 node_ip=192.0.2.10

[workers]
k8s-worker-1 ansible_host=192.0.2.11 node_ip=192.0.2.11
k8s-worker-2 ansible_host=192.0.2.12 node_ip=192.0.2.12

[k8s_cluster:children]
control_plane
workers

[k8s_cluster:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_ed25519
cluster_name=k8s-lab-manual
