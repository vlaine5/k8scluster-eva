# =============================================================================
#  Modèle d'inventaire du mode existing (machines Linux qui existent déjà).
#
#    cp ansible/inventories/existing.example.ini ansible/inventories/homelab.ini
#    puis dans .env : DEPLOYMENT_MODE=existing
#                     EXISTING_INVENTORY=ansible/inventories/homelab.ini
#
#  Exigences : SSH par clé (aucun mot de passe ici : refusé), sudo sans mot de
#  passe pour ansible_user, Python 3. Guide : docs/existing-mode.md
#  Les adresses ci-dessous sont des exemples (RFC 5737) : remplacez-les.
# =============================================================================

[control_plane]
k8s-cp-1 ansible_host=192.0.2.100 node_ip=192.0.2.100

[workers]
k8s-worker-1 ansible_host=192.0.2.101 node_ip=192.0.2.101
k8s-worker-2 ansible_host=192.0.2.102 node_ip=192.0.2.102
# Disque Longhorn propre à une machine (sinon LONGHORN_DISK_DEVICE dans .env) :
# k8s-worker-3 ansible_host=192.0.2.103 node_ip=192.0.2.103 longhorn_disk_device=/dev/disk/by-id/...

[k8s_cluster:children]
control_plane
workers

[k8s_cluster:vars]
ansible_user=admin
ansible_ssh_private_key_file=~/.ssh/id_ed25519
