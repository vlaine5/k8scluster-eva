# Configuration Ansible du lab.
# Lancez toujours ansible-playbook depuis ce dossier (ansible/) pour que ce
# fichier soit pris en compte (./k8s-lab le fait pour vous).
[defaults]
roles_path = roles
host_key_checking = True
callback_result_format = yaml
retry_files_enabled = False
interpreter_python = auto_silent
forks = 10
timeout = 30

[ssh_connection]
pipelining = True
# accept-new : la clé d'hôte d'une nouvelle VM est acceptée automatiquement,
# mais une clé qui CHANGE pour une IP connue est refusée (protection MITM).
# Le fichier est propre au lab : ./k8s-lab destroy en nettoie les entrées.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=../.lab/known_hosts
