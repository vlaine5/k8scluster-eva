---
# =============================================================================
#  Réglages Kubernetes communs à tous les nœuds (installation kubeadm).
#
#  ./k8s-lab transmet les valeurs résolues de config/lab.env (et de votre
#  .env) en "extra vars" (-e @.lab/ansible/<contexte>-vars.json), qui ont la
#  priorité la plus haute dans Ansible. Les valeurs ci-dessous ne servent que
#  si vous lancez ansible-playbook à la main. Correspondance : docs/configuration.md
#  Les VERSIONS viennent toutes de config/versions.yaml (lab_lock ci-dessous).
# =============================================================================

# Fichier de verrouillage des versions (lu sur votre poste, jamais copié).
lab_lock: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../config/versions.yaml') | from_yaml }}"

# Version complète de Kubernetes (paquets kubeadm, kubelet, kubectl).
kubernetes_version: "1.36.5"

# Réseau des Pods (doit correspondre au CNI) et réseau des Services.
pod_cidr: "10.244.0.0/16"
service_cidr: "10.96.0.0/12"

# CNI : flannel (par défaut), calico, cilium, ou none (vous installez le vôtre).
cni: flannel
# Vide = version verrouillée de config/versions.yaml.
cni_version: ""
# auto = mode par défaut du CNI (vxlan).
cni_mode: auto
# Ancien réglage, conservé pour la compatibilité : version de Flannel.
flannel_version: "v0.28.10"
# iptables | nftables | ipvs | cilium (remplacement de kube-proxy par Cilium)
kube_proxy_mode: iptables

# Runtime de conteneurs : seul containerd est supporté.
container_runtime: containerd
# Motif de version du paquet containerd.io (dépôt Docker, containerd 2.x). Vide = verrouillé.
containerd_version: "2.3.*"
# Rocky : étiquetage SELinux des conteneurs (false = hôte en enforcing, conteneurs non confinés).
containerd_selinux: false

# signed : certificats de service des kubelets signés par la CA du cluster.
kubelet_serving_certs: signed
# disable | keep (swap conservé, kubelet en LimitedSwap)
node_swap: disable
# auto | managed | unmanaged
node_firewall: auto

# Haute disponibilité : adresse stable de l'API.
control_plane_vip: ""
control_plane_endpoint: ""
api_lb_provider: none

# Contrôles et prérequis (renseignés par ./k8s-lab selon les addons choisis).
node_os_expected: {name: auto}
node_prereqs: {packages: {debian: [], redhat: []}, kernel_modules: [], services: [], firewall_ports: []}
hubble: {enabled: false, ui: false}
loadbalancer: {provider: none}
gateway_api_crds: {}
istio_selected: false
longhorn_disk: {enabled: false}
backup: {etcd_snapshots: false}
lab_platform: manual

# Où écrire le kubeconfig récupéré depuis le control-plane (sur VOTRE poste).
kubeconfig_output_dir: "{{ playbook_dir }}/../.kube/clusters"

# -----------------------------------------------------------------------------
#  Variables dérivées : ne pas modifier.
# -----------------------------------------------------------------------------
# Nom du cluster : fourni par l'inventaire généré (ex : k8s-lab-vagrant).
k8s_cluster_name: "{{ cluster_name | default('k8s-lab') }}"
# Version "mineure" (ex : 1.36) : le dépôt pkgs.k8s.io est propre à chaque mineure.
kubernetes_minor_version: "{{ kubernetes_version.split('.')[0:2] | join('.') }}"
# IP utilisée par Kubernetes sur chaque nœud. Indispensable quand une VM a
# plusieurs cartes réseau (cas de Vagrant : NAT + réseau privé).
k8s_node_ip: "{{ node_ip | default(ansible_facts['default_ipv4'].address) }}"
# Famille de système : debian (Ubuntu, Debian) ou redhat (Rocky).
k8s_os_family: "{{ ansible_facts['os_family'] | lower }}"
# Le 1er control-plane initialise le cluster (kubeadm init) ; les autres le rejoignent.
k8s_control_plane_host: "{{ groups['control_plane'] | first }}"
k8s_control_plane_ip: "{{ hostvars[k8s_control_plane_host]['k8s_node_ip'] }}"
k8s_ha: "{{ groups['control_plane'] | length > 1 }}"
# Adresse stable de l'API : VIP/répartiteur si défini, sinon IP du 1er control-plane.
k8s_api_endpoint: "{{ control_plane_endpoint if control_plane_endpoint | length > 0 else k8s_control_plane_ip ~ ':6443' }}"
k8s_api_host: "{{ k8s_api_endpoint.rsplit(':', 1) | first }}"
k8s_api_port: "{{ k8s_api_endpoint.rsplit(':', 1) | last }}"
# Composant CNI verrouillé et version effective.
k8s_cni_component: "{{ lab_lock.components[cni] | default({}) }}"
k8s_cni_version: "{{ cni_version if cni_version | length > 0 else (flannel_version if cni == 'flannel' else k8s_cni_component.version | default('')) }}"
k8s_cni_mode: "{{ cni_mode if cni_mode != 'auto' else 'vxlan' }}"
# Fichier témoin : ce nœud appartient à un cluster géré par ce lab.
k8s_lab_marker: /etc/k8s-lab/cluster
