---
# =============================================================================
#  Déploiement d'un cluster Kubernetes avec kubeadm (1, 3 ou 5 control-planes).
#
#  Les étapes suivent la documentation officielle :
#  https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/
#
#    1. Contrôles préalables (lecture seule)
#    2. Préparer tous les nœuds : OS, containerd, kubeadm/kubelet/kubectl,
#       prérequis des addons, disque dédié Longhorn
#    3. Initialiser le 1er control-plane (kubeadm init, VIP kube-vip en HA)
#    4. Installer le CNI et les composants de base
#    5. Joindre les autres control-planes, un à la fois (etcd vérifié)
#    6. Joindre les workers
#    7. Vérifier le cluster et récupérer le kubeconfig sur votre poste
#
#  Utilisation (depuis le dossier ansible/) :
#    ansible-playbook -i inventories/<inventaire>.ini site.yml [-e @vars.json]
#
#  Ce playbook est idempotent : le relancer ne casse pas un cluster existant
#  et ne change jamais sa version (voir upgrade.yml).
# =============================================================================

- name: Check the inventory and wait for the nodes
  hosts: k8s_cluster
  gather_facts: false
  tasks:
    - name: Check the number of control-planes
      ansible.builtin.assert:
        that:
          - groups['control_plane'] is defined
          - groups['control_plane'] | length in [1, 3, 5]
          - groups['control_plane'] | length == 1 or control_plane_endpoint | length > 0
        fail_msg: >-
          The inventory must contain 1, 3 or 5 hosts in [control_plane] (found
          {{ groups['control_plane'] | default([]) | length }}); several control-planes need a stable
          endpoint (CONTROL_PLANE_VIP or CONTROL_PLANE_ENDPOINT). docs/high-availability.md
        quiet: true
      run_once: true
      delegate_to: localhost

    - name: Wait until the node accepts SSH connections (cloud-init may still be running)
      ansible.builtin.wait_for_connection:
        timeout: 600

    # Les images cloud finissent leur configuration en arrière-plan : on attend
    # la fin de cloud-init pour éviter les conflits sur le verrou APT/DNF.
    # "removes" : la commande n'est lancée que si cloud-init est installé.
    - name: Wait for cloud-init to finish (if present)
      ansible.builtin.command:
        argv: [cloud-init, status, --wait]
        removes: /usr/bin/cloud-init
      register: site_cloud_init
      changed_when: false
      # 2 = terminé avec des avertissements non bloquants (cloud-init >= 23.4)
      failed_when: site_cloud_init.rc | default(0) not in [0, 2]

    - name: Gather facts
      ansible.builtin.setup:

- name: Preflight checks (read-only)
  hosts: k8s_cluster
  become: true
  gather_facts: false
  roles:
    - role: preflight

- name: Prepare every node (OS, container runtime, Kubernetes packages, addon prerequisites)
  hosts: k8s_cluster
  become: true
  gather_facts: false
  roles:
    - role: common
    - role: container_runtime
    - role: kubernetes
    - role: node_prereqs

- name: Prepare the dedicated Longhorn disks (storage nodes = workers, or control-planes without worker)
  hosts: k8s_cluster
  become: true
  gather_facts: false
  roles:
    - role: storage_disk
      when:
        - longhorn_disk.enabled | default(false) | bool
        - inventory_hostname in (groups['workers'] if groups['workers'] | default([]) | length > 0 else groups['control_plane'])

- name: Initialize the first control-plane
  hosts: control_plane[0]
  become: true
  gather_facts: false
  roles:
    - role: control_plane

- name: Install the Pod network (CNI) and the core components
  hosts: control_plane[0]
  become: true
  gather_facts: false
  roles:
    - role: cni
    - role: cluster_core

- name: Join the additional control-planes, one at a time
  hosts: control_plane[1:]
  become: true
  gather_facts: false
  serial: 1
  roles:
    - role: control_plane

- name: Join the workers
  hosts: workers
  become: true
  gather_facts: false
  roles:
    - role: worker

- name: Verify the cluster and export the kubeconfig
  hosts: control_plane[0]
  become: true
  gather_facts: false
  tasks:
    - name: Verify the cluster
      ansible.builtin.include_role:
        name: control_plane
        tasks_from: verify.yml

    - name: Export the kubeconfig to the Ansible controller
      ansible.builtin.include_role:
        name: control_plane
        tasks_from: kubeconfig.yml

- name: Schedule the etcd snapshots (BACKUP_ENABLED)
  hosts: control_plane
  become: true
  gather_facts: false
  tasks:
    - name: Install the etcd snapshot timer
      ansible.builtin.include_role:
        name: etcd
        tasks_from: schedule.yml
      when: backup.etcd_snapshots | default(false) | bool
