---
# =============================================================================
#  Récupère le kubeconfig du control-plane vers .kube/clusters/<cluster>.yaml
#  (sur votre poste), sans rien modifier sur le cluster.
#
#    cd ansible
#    ansible-playbook -i inventories/<inventaire>.ini kubeconfig.yml
# =============================================================================

- name: Export the kubeconfig to the Ansible controller
  hosts: control_plane
  become: true
  gather_facts: false
  tasks:
    - name: Export the kubeconfig
      ansible.builtin.include_role:
        name: control_plane
        tasks_from: kubeconfig.yml
