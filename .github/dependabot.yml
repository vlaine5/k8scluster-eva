# Propositions automatiques de mises à jour (une PR par mise à jour, à tester avant fusion).
# Les versions Kubernetes, CNI et addons sont verrouillées dans
# config/versions.yaml : voir docs/versions.md et docs/maintenance.md.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: terraform
    directories:
      - /terraform/providers/proxmox
      - /terraform/providers/vsphere
      - /terraform/providers/libvirt
    schedule:
      interval: monthly

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
