# =============================================================================
#  CI du lab : validation statique de tout le code, rendu de tous les addons,
#  puis tests de bout en bout RÉELS sur les runners GitHub (aucune
#  infrastructure externe, aucun secret réel) :
#    - kind : déploiement par les commandes make des guides, puis addons
#      (scénarios tests/e2e/*.env) avec leurs tests fonctionnels ;
#    - minikube (driver docker) ;
#    - kubeadm sur des nœuds conteneurs systemd par le VRAI CLI (mode existing) :
#      Ubuntu / Debian / Rocky, Flannel / Calico / Cilium, HA 3 control-planes
#      (kube-vip), mise à niveau 1.36 -> 1.37, restauration etcd.
#  Vagrant, Proxmox, vSphere, libvirt et EKS sont validés statiquement
#  (validate, TFLint, terraform test avec API simulées). Le test EKS réel est le
#  workflow manuel eks-e2e.yml.
# =============================================================================
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell, Vagrantfile, cohérence de la config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: |
          shellcheck --version
          make shellcheck

      - name: Syntaxe du Vagrantfile
        run: make ruby-check

      - name: Installer Vagrant (version de config/lab.env, SHA-256 vérifié)
        run: |
          version="$(sed -n 's/^VAGRANT_VERSION=//p' config/lab.env)"
          base="https://releases.hashicorp.com/vagrant/${version}"
          cd "$RUNNER_TEMP"
          curl -fsSLO --retry 3 "${base}/vagrant_${version}-1_amd64.deb"
          curl -fsSLO --retry 3 "${base}/vagrant_${version}_SHA256SUMS"
          sha256sum --check --ignore-missing "vagrant_${version}_SHA256SUMS"
          sudo dpkg -i "vagrant_${version}-1_amd64.deb"
          vagrant --version

      - name: vagrant validate (VirtualBox, 2 puis 4 workers, sans hyperviseur)
        run: make vagrant-validate

      - name: Installer actionlint (version de config/lab.env, SHA-256 vérifié)
        run: |
          version="$(sed -n 's/^ACTIONLINT_VERSION=//p' config/lab.env)"
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          cd "$RUNNER_TEMP"
          curl -fsSLO --retry 3 "${base}/actionlint_${version}_linux_amd64.tar.gz"
          curl -fsSLO --retry 3 "${base}/actionlint_${version}_checksums.txt"
          sha256sum --check --ignore-missing "actionlint_${version}_checksums.txt"
          mkdir -p "$HOME/.local/bin"
          tar -xzf "actionlint_${version}_linux_amd64.tar.gz" -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: actionlint (workflows, dont le workflow EKS manuel)
        run: make actionlint

      - name: Cohérence config/lab.env <-> Terraform / Ansible / kind
        run: make check-config

  ansible:
    name: Ansible (yamllint, ansible-lint, syntax-check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-lab

      - name: yamllint
        run: make yamllint

      - name: ansible-lint (profil production, rôles et tâches des addons)
        run: make ansible-lint

      - name: ansible-playbook --syntax-check
        run: make ansible-syntax

  python:
    name: Résolveur (tests unitaires, catalogue, schéma)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-lab

      - name: Tests unitaires (pytest)
        run: make test-unit

      - name: Catalogue d'addons et schéma de configuration
        run: |
          make catalog-check
          make schema-check

  addons-render:
    name: Addons (rendu + helm template de chaque release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-lab
        with:
          tools: helm

      - name: Rendu de tous les modèles (3 scénarios) et validation par les charts verrouillés
        run: make addons-render-check

  terraform:
    name: Terraform (fmt, validate, test, TFLint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lire les versions depuis config/lab.env
        id: versions
        run: |
          echo "terraform=$(sed -n 's/^TERRAFORM_VERSION=//p' config/lab.env)" >> "$GITHUB_OUTPUT"
          echo "tflint=$(sed -n 's/^TFLINT_VERSION=//p' config/lab.env)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.versions.outputs.terraform }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: ${{ steps.versions.outputs.tflint }}

      - name: terraform fmt -check
        run: make terraform-fmt

      - name: terraform validate (proxmox, vsphere, libvirt, eks)
        run: make terraform-validate

      - name: terraform test (modules, providers avec API simulées)
        run: make terraform-test

      - name: TFLint
        run: make tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}

  docs:
    name: Documentation (markdownlint, liens, commandes citées)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

      - uses: ./.github/actions/setup-lab

      - name: Liens, pages docs/*.md et commandes make cités
        run: make check-docs

      - name: Sections générées à jour (variables, catalogue, versions, compatibilité)
        run: make docs-check

  e2e-kind:
    name: E2E Kind (commandes des guides, nginx)
    needs: [shell, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-lab
        with:
          tools: kind kubectl helm

      # Les étapes suivantes sont exactement les commandes du guide docs/deploy-kind.md.
      - name: make help / make doctor
        run: |
          make help
          make doctor
          make doctor MODE=kind

      - name: make config / make deploy MODE=kind (1 control-plane + 2 workers)
        run: |
          make config MODE=kind
          make deploy MODE=kind

      - name: deploy une seconde fois avec ./k8s-lab (idempotence, rien ne doit être recréé)
        run: |
          ./k8s-lab deploy kind | tee second-deploy.log
          grep -q "existe déjà" second-deploy.log

      - name: kubectl (export KUBECONFIG, get nodes, get pods -A, certificats kubelet)
        run: |
          export KUBECONFIG="$PWD/.kube/config"
          kubectl get nodes
          kubectl get pods -A
          test "$(kubectl get nodes --no-headers | grep -c ' Ready ')" -eq 3
          kubectl get csr
          kubectl logs -n kube-system -l component=kube-apiserver --tail=1

      - name: make status / make kubeconfig / make test
        run: |
          make status
          make kubeconfig
          make test

      - name: Diagnostic en cas d'échec
        if: failure()
        run: |
          export KUBECONFIG="$PWD/.kube/config"
          kubectl get nodes -o wide || true
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true
          kind export logs ./kind-logs --name k8s-lab || true

      - name: Conserver les logs kind
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kind-logs
          path: kind-logs
          retention-days: 7

      - name: make destroy MODE=kind YES=1
        if: always()
        run: make destroy MODE=kind YES=1

  e2e-kind-addons:
    name: E2E Kind + addons (${{ matrix.scenario }})
    needs: [shell, python, addons-render]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario: [kind-core, kind-traefik-storage, kind-cilium, kind-observability, kind-security]
    env:
      LAB_ENV_FILE: tests/e2e/${{ matrix.scenario }}.env
      # Identifiants FACTICES du stockage S3 de test (tests/e2e/fixtures/s3-server.yaml).
      VELERO_S3_ACCESS_KEY: ci-test-access
      VELERO_S3_SECRET_KEY: ci-test-secret-not-real
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-lab
        with:
          tools: kind kubectl helm

      - name: Plan résolu (make config, make addons-plan)
        run: |
          make config
          make addons-plan

      - name: Cluster sans addons, puis services de test (NFS, S3) pour le scénario stockage
        if: matrix.scenario == 'kind-traefik-storage'
        env:
          ADDONS: ""
          STORAGE_BACKENDS: ""
          GATEWAY_CONTROLLER: none
          LOADBALANCER_PROVIDER: none
        run: |
          make deploy
          export KUBECONFIG="$PWD/.kube/config"
          sudo modprobe nfsd
          kubectl apply -f tests/e2e/fixtures/nfs-server.yaml
          kubectl create namespace s3-test --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n s3-test create secret generic s3-root --from-literal=access="$VELERO_S3_ACCESS_KEY" \
            --from-literal=secret="$VELERO_S3_SECRET_KEY" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f tests/e2e/fixtures/s3-server.yaml
          kubectl -n nfs-test rollout status deploy/nfs-server --timeout=180s
          kubectl -n s3-test rollout status deploy/s3 --timeout=180s

      - name: make deploy (cluster + addons + tests fonctionnels des addons)
        run: make deploy

      - name: make addons-status
        run: make addons-status

      - name: Idempotence (2e make addons-apply sans aucun changement)
        run: |
          make addons-apply | tee addons-second-apply.log
          if grep -E '^localhost +: .*changed=[1-9]' addons-second-apply.log; then
            echo "::error::La 2e installation des addons a modifié le cluster (voir les tâches « changed » ci-dessus)."
            exit 1
          fi

      - name: Diagnostic en cas d'échec
        if: failure()
        run: |
          export KUBECONFIG="$PWD/.kube/config"
          kubectl get nodes -o wide || true
          kubectl get pods -A -o wide || true
          helm list -A --kube-context "kind-$(sed -n 's/^CLUSTER_NAME=//p' "$LAB_ENV_FILE")" || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -80 || true
          mkdir -p diag
          if [ -d .lab/reports ]; then cp -r .lab/reports diag/; fi

      - name: Conserver les rapports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ matrix.scenario }}
          path: diag
          retention-days: 7

      - name: make destroy YES=1
        if: always()
        run: make destroy YES=1

  e2e-minikube:
    name: E2E Minikube (driver docker, metrics-server natif)
    needs: [shell, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-lab
        with:
          tools: minikube kubectl helm

      # Les étapes suivantes sont exactement les commandes du guide docs/deploy-minikube.md.
      - name: make doctor MODE=minikube
        run: make doctor MODE=minikube

      - name: make deploy MODE=minikube (avec l'addon metrics-server)
        run: make deploy MODE=minikube
        env:
          MINIKUBE_DRIVER: docker
          ADDONS: metrics-server

      - name: kubectl (export KUBECONFIG, get nodes, get pods -A, top)
        run: |
          export KUBECONFIG="$PWD/.kube/config"
          kubectl get nodes
          kubectl get pods -A
          kubectl top nodes

      - name: make test (nginx + Service + DNS)
        run: make test

      - name: Diagnostic en cas d'échec
        if: failure()
        run: |
          minikube logs --profile k8s-lab --length 200 || true

      - name: make destroy MODE=minikube YES=1
        if: always()
        run: make destroy MODE=minikube YES=1

  e2e-kubeadm:
    name: E2E kubeadm (${{ matrix.name }})
    needs: [ansible, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Ubuntu 24.04, Flannel, 1 CP + 2 workers, restauration etcd"
            os: "ubuntu"
            version: "24.04"
            cps: 1
            workers: 2
            cni: "flannel"
            restore: "1"
            experimental: false
          - name: "Debian 12, Calico"
            os: "debian"
            version: "12"
            cps: 1
            workers: 1
            cni: "calico"
            experimental: false
          - name: "Debian 13, Flannel"
            os: "debian"
            version: "13"
            cps: 1
            workers: 1
            cni: "flannel"
            experimental: false
          - name: "Rocky Linux 9, Flannel"
            os: "rocky"
            version: "9"
            cps: 1
            workers: 1
            cni: "flannel"
            experimental: false
          - name: "HA 3 control-planes, Cilium sans kube-proxy, kube-vip"
            os: "ubuntu"
            version: "24.04"
            cps: 3
            workers: 1
            cni: "cilium"
            experimental: false
          - name: "Mise à niveau 1.36.5 -> 1.37.1"
            os: "ubuntu"
            version: "24.04"
            cps: 1
            workers: 1
            cni: "flannel"
            kubernetes: "1.36.5"
            upgrade: "1.37.1"
            experimental: false
          - name: "Ubuntu 26.04 (expérimental)"
            os: "ubuntu"
            version: "26.04"
            cps: 1
            workers: 1
            cni: "flannel"
            experimental: true
          - name: "Rocky Linux 10 (expérimental)"
            os: "rocky"
            version: "10"
            cps: 1
            workers: 1
            cni: "flannel"
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-lab
        with:
          tools: kubectl helm

      - name: ./k8s-lab deploy existing sur des nœuds conteneurs (${{ matrix.os }} ${{ matrix.version }})
        run: tests/kubeadm-in-docker/run.sh
        env:
          NODE_OS: ${{ matrix.os }}
          NODE_OS_VERSION: ${{ matrix.version }}
          CONTROL_PLANES: ${{ matrix.cps }}
          WORKERS: ${{ matrix.workers }}
          CNI: ${{ matrix.cni }}
          KUBERNETES_VERSION: ${{ matrix.kubernetes }}
          UPGRADE_TO: ${{ matrix.upgrade }}
          RESTORE_TEST: ${{ matrix.restore }}
