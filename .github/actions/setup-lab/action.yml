# Préparation commune des jobs : Python du lab (résolveur, ansible-core, bibliothèque
# kubernetes, outils de test), collections Ansible et outils CLI aux versions de
# config/lab.env (SHA-256 vérifiés par scripts/install-tools.sh).
name: Préparer le lab
description: Python, Ansible, collections et outils CLI (kind, kubectl, helm, minikube) du lab.
inputs:
  tools:
    description: Outils à installer avec scripts/install-tools.sh (séparés par des espaces).
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Python et collections Ansible (versions épinglées)
      shell: bash
      run: |
        pip install -r requirements-dev.txt
        ansible-galaxy collection install -r ansible/requirements.yml

    - name: Outils CLI
      if: inputs.tools != ''
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: |
        # shellcheck disable=SC2086 # liste d'outils
        scripts/install-tools.sh $TOOLS
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
