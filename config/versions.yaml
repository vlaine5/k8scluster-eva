# =============================================================================
#  k8s-lab — VERROUILLAGE DES VERSIONS (source unique de vérité)
# =============================================================================
#
#  Toutes les versions de composants installés par le framework sont ici :
#  Kubernetes, containerd, images des OS, CNI, Gateway API, charts Helm des
#  addons. Aucune autre partie du code ne fixe de version (le script
#  scripts/check-config-sync.sh le vérifie pour les copies indispensables).
#
#  Règles :
#    - jamais "latest" ni branche "master" : une version exacte, vérifiée ;
#    - les manifestes téléchargés ont un SHA-256 ;
#    - "kube_min" vient du champ kubeVersion du chart ou de la doc officielle ;
#    - "kube_tested" = versions mineures de Kubernetes que le PROJET amont
#      déclare tester. Hors de cette liste : avertissement (ou erreur avec
#      COMPATIBILITY_POLICY=strict).
#
#  Vérifier les mises à jour disponibles (sans rien installer) :
#    make versions-check
#  Procédure de mise à jour : docs/upgrades.md
#
#  Versions vérifiées le 2026-10-13 auprès des sources officielles (index
#  des dépôts Helm, tags Git des projets, miroirs des distributions).
# =============================================================================
schema_version: 1
checked_on: "2026-10-13"

# -----------------------------------------------------------------------------
#  Kubernetes (kubeadm) — dépôt officiel pkgs.k8s.io
# -----------------------------------------------------------------------------
kubernetes:
  # Version par défaut (doit être égale à KUBERNETES_VERSION de config/lab.env).
  # 1.37.1 est la dernière version publiée, mais Cilium 1.20, Envoy Gateway 1.9
  # et la plupart des contrôleurs ne la déclarent pas encore testée : 1.36.5 est
  # la version la plus récente compatible avec TOUT le catalogue (docs/versions.md).
  version: "1.36.5"
  # Mineures que le framework sait installer (dépôts pkgs.k8s.io existants).
  supported_minors: ["1.34", "1.35", "1.36", "1.37"]
  # Dernier patch connu de chaque mineure (make versions-check les compare).
  latest_patches:
    "1.34": "1.34.12"
    "1.35": "1.35.9"
    "1.36": "1.36.5"
    "1.37": "1.37.1"
  # Images kindest/node publiées avec kind v0.33.0 (épinglées par digest).
  kind_node_images:
    "1.37": "kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5"
    "1.36": "kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed"
    "1.35": "kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0"
    "1.34": "kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d"

# containerd 2.x (paquet containerd.io du dépôt Docker, apt et dnf).
containerd:
  version: "2.3.*"
  latest_seen: "2.4.1"

# Helm installé sur le 1er control-plane (CNI Calico/Cilium, approbateur de CSR).
helm:
  version: "v4.3.0"
  sha256:
    amd64: "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb"
    arm64: "31c5794dd55c66a51e6b7d2e2ac7a114ae8b1de41ff1d9ba51748ac973b06a08"

# VIP de l'API Kubernetes en mode HA (pod statique sur chaque control-plane).
kube_vip:
  version: "v1.2.4"
  image: "ghcr.io/kube-vip/kube-vip"

# -----------------------------------------------------------------------------
#  Systèmes d'exploitation des nœuds (modes VM : vagrant, terraform)
# -----------------------------------------------------------------------------
#  status : supported | experimental        validated : ci | none
#  x86_64_level : niveau de micro-architecture minimal exigé par la distribution.
#  ATTENTION : Rocky Linux 10 (comme RHEL 10) exige x86-64-v3 (AVX2) : il ne
#  démarre PAS sur un CPU Westmere (Xeon X5690) ni avec NODE_CPU_TYPE=x86-64-v2-AES.
os:
  ubuntu:
    "24.04":
      codename: noble
      family: debian
      status: supported
      validated: none
      kernel: "6.8"
      x86_64_level: v1
      ssh_user: ubuntu
      vagrant_box: bento/ubuntu-24.04
      image_url: https://cloud-images.ubuntu.com/releases/noble/release-20260926/ubuntu-24.04-server-cloudimg-amd64.img
      image_sha256: 6a81c37564db9b1ee84e141922625e1d7c5b389b99bb3c572e0243607d5bb4d2
    "26.04":
      codename: resolute
      family: debian
      status: experimental
      validated: ci
      kernel: "7.0"
      x86_64_level: v1
      ssh_user: ubuntu
      vagrant_box: bento/ubuntu-26.04
      image_url: https://cloud-images.ubuntu.com/releases/resolute/release-20260927/ubuntu-26.04-server-cloudimg-amd64.img
      image_sha256: 8800651811af9a85465ad1d552add729947bb16488dddb4a9b5305a3d97332b2
  debian:
    "12":
      codename: bookworm
      family: debian
      status: supported
      validated: ci
      kernel: "6.1"
      x86_64_level: v1
      ssh_user: debian
      vagrant_box: bento/debian-12
      # Image "generic" (noyau complet : iscsi_tcp, dm_crypt... requis par Longhorn).
      # Debian publie des SHA-512 : ce SHA-256 a été calculé après vérification du SHA512SUMS officiel.
      image_url: https://cloud.debian.org/images/cloud/bookworm/20261006-2623/debian-12-generic-amd64-20261006-2623.qcow2
      image_sha256: 412eee91cefc75316edda6fcc3b3f735857c54e31dbb6ed635cfe2cfa092c9ad
    "13":
      codename: trixie
      family: debian
      status: supported
      validated: ci
      kernel: "6.12"
      x86_64_level: v1
      ssh_user: debian
      vagrant_box: bento/debian-13
      image_url: https://cloud.debian.org/images/cloud/trixie/20261001-2618/debian-13-generic-amd64-20261001-2618.qcow2
      image_sha256: 07f9fe05fe7cb1702047034830150baddd66c8be06e233bb226c84aa8a275263
  rocky:
    "9":
      codename: el9
      family: redhat
      status: supported
      validated: ci
      kernel: "5.14"
      x86_64_level: v2
      ssh_user: rocky
      vagrant_box: bento/rockylinux-9
      image_url: https://dl.rockylinux.org/pub/rocky/9/images/x86_64/Rocky-9-GenericCloud-Base-9.8-20260525.0.x86_64.qcow2
      image_sha256: 92c206cc6f790c61583247eefe87890f8828420662c17cacf247cec78ab4eec8
    "10":
      codename: el10
      family: redhat
      status: experimental
      validated: ci
      kernel: "6.12"
      x86_64_level: v3
      ssh_user: rocky
      vagrant_box: bento/rockylinux-10
      image_url: https://dl.rockylinux.org/pub/rocky/10/images/x86_64/Rocky-10-GenericCloud-Base-10.2-20260525.0.x86_64.qcow2
      image_sha256: 9fc9e9ff16888bb68ac39b0392e25c9c92684d50c85f1cce6ab549363bbc4b48

# -----------------------------------------------------------------------------
#  Composants (CNI, Gateway API, addons)
# -----------------------------------------------------------------------------
#  type : helm (dépôt HTTP) | helm-oci | manifest (URL + SHA-256)
components:
  # --- CNI -------------------------------------------------------------------
  flannel:
    type: manifest
    version: "v0.28.10"
    url: "https://github.com/flannel-io/flannel/releases/download/{version}/kube-flannel.yml"
    sha256:
      v0.28.9: "1c06a15a771009c263bdb1f51c928af46f7606fe969f3963652167938d536aaa"
      v0.28.10: "393bdbce53eb50c8eb97dd513b218518b7d6e7985dc7b889be956e112a711084"
    docs: https://github.com/flannel-io/flannel
  calico:
    type: helm
    repo: https://docs.tigera.io/calico/charts
    chart: tigera-operator
    # CRD dans un chart séparé depuis v3.32 (même dépôt, même version).
    crds_chart: crd.projectcalico.org.v1
    version: "v3.33.0"
    kube_min: "1.31"
    docs: https://docs.tigera.io/calico/latest/getting-started/kubernetes/requirements
  cilium:
    type: helm
    repo: https://helm.cilium.io
    chart: cilium
    version: "1.20.2"
    kube_min: "1.33"
    kube_tested: ["1.33", "1.34", "1.35", "1.36"]
    kernel_min: "5.10"
    gateway_api: "v1.6.1"
    docs: https://docs.cilium.io/en/v1.20/network/kubernetes/compatibility/

  # --- Gateway API (CRD officielles, SHA-256 des manifestes de release) -------
