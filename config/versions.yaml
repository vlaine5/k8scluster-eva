    type: manifest
    url: "https://github.com/kubernetes-sigs/gateway-api/releases/download/{version}/{channel}-install.yaml"
    sha256:
      v1.6.1:
        standard: "24d931f22abd8e40c973264319ead7cfa09d0fb7716b7ab1ee2ff174cb063a73"
        experimental: "d7fa77650e4ef28fca0411536fcb5e237deb4d50301cfded3be49d9a1b7bbd02"
      v1.6.2:
        standard: "faede450fa178126aba41337737b97d351ebe87d93c910237ce1e072d1ca40d9"
        experimental: "fb03263a4a720cc7abe9b36ede6e308b558d2d725a39595d664f34fe37f9c503"
    latest_seen: "v1.6.3"
  traefik:
    type: helm
    repo: https://traefik.github.io/charts
    chart: traefik
    version: "41.7.1"
    app_version: "v3.7.14"
    kube_min: "1.25"
    gateway_api: "v1.6.2"
    docs: https://doc.traefik.io/traefik/reference/install-configuration/providers/kubernetes/kubernetes-gateway/
  envoy-gateway:
    type: helm-oci
    chart: oci://docker.io/envoyproxy/gateway-helm
    crds_chart: oci://docker.io/envoyproxy/gateway-crds-helm
    version: "v1.9.2"
    kube_min: "1.33"
    kube_tested: ["1.33", "1.34", "1.35", "1.36"]
    gateway_api: "v1.6.1"
    docs: https://gateway.envoyproxy.io/news/releases/matrix/

  # --- Réseau -------------------------------------------------------------------
  metallb:
    type: helm
    repo: https://metallb.github.io/metallb
    chart: metallb
    version: "0.16.1"
    kube_min: "1.19"
  external-dns:
    type: helm
    repo: https://kubernetes-sigs.github.io/external-dns
    chart: external-dns
    version: "1.23.0"
    app_version: "0.23.0"

  # --- Stockage -----------------------------------------------------------------
  csi-driver-nfs:
    type: helm
    repo: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
    chart: csi-driver-nfs
    version: "4.13.5"
  longhorn:
    type: helm
    repo: https://charts.longhorn.io
    chart: longhorn
    version: "1.13.0"
    kube_min: "1.34"
    # OS vérifiés par le projet Longhorn pour la 1.13 (les autres : "non vérifié").
    os_verified: ["ubuntu-26.04", "rocky-10"]
    docs: https://longhorn.io/docs/1.13.0/best-practices/
  snapshot-controller:
    type: manifest
    version: "v8.7.0"
    base_url: "https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/{version}"
