      client/config/crd/snapshot.storage.k8s.io_volumesnapshots.yaml: "b032116e987fb1d7d93cec7d942833adeb9d95c9bdc7e00c10b280c2fe4a6c33"
      deploy/kubernetes/snapshot-controller/rbac-snapshot-controller.yaml: "99c4ac480b6c9563be0d85599e29cc7b68b25a82d250b0e789726727551e8d38"
      deploy/kubernetes/snapshot-controller/setup-snapshot-controller.yaml: "54b9342a7433c377b83a671babf416660078a716ec2e63f658a77aa629de5581"

