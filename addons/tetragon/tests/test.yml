---
# =============================================================================
#  Test de Tetragon : l'exécution d'un processus dans un Pod et la lecture de
#  /etc/shadow (TracingPolicy du lab) apparaissent dans les événements exportés.
# =============================================================================

- name: Run a process that reads a sensitive file
  kubernetes.core.k8s:
    kubeconfig: "{{ addon_kubeconfig }}"
    context: "{{ addon_context }}"
    state: present
    definition:
      apiVersion: v1
      kind: Pod
      metadata: {name: tetragon-trigger, namespace: "{{ addon_test_ns }}"}
      spec:
        restartPolicy: Never
        containers:
          - name: test
            image: "{{ lab_test_images.busybox }}"
            command: [sh, -c, "sleep 5; cat /etc/shadow > /dev/null; sleep 30"]

- name: Find the events of the Pod
  ansible.builtin.command:
    argv: "{{ addon_kubectl + ['-n', 'kube-system', 'logs', '-l', 'app.kubernetes.io/name=tetragon', '-c', 'export-stdout',
           '--since=10m', '--tail=-1', '--max-log-requests=20'] }}"
  register: tetragon_test_events
  changed_when: false
  until: >-
    'tetragon-trigger' in tetragon_test_events.stdout
    and 'process_exec' in tetragon_test_events.stdout
    and '/etc/shadow' in tetragon_test_events.stdout
  retries: 18
  delay: 10
