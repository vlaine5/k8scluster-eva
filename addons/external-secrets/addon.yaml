id: external-secrets
name: External Secrets Operator
description: >-
  Synchronise des Secrets Kubernetes depuis un gestionnaire externe (Vault, AWS Secrets Manager,
  Bitwarden...). L'exemple fourni utilise le fournisseur « kubernetes » : aucun secret réel.
category: security
phase: 7
components: [external-secrets]
integrates_with: [prometheus-operator-crds]
support:
  default: supported
validated: [ci-kind]
resources: {cpu_m: 100, memory_mb: 192}
install:
  namespace: external-secrets
  pod_security: restricted
  releases:
    - {name: external-secrets, component: external-secrets, namespace: external-secrets, values: values.yaml.j2, timeout: 10m}
health:
  - {kind: Deployment, namespace: external-secrets, name: external-secrets}
  - {kind: Deployment, namespace: external-secrets, name: external-secrets-webhook}
  - {kind: Deployment, namespace: external-secrets, name: external-secrets-cert-controller}
tests: tests/test.yml
remove:
  notes: "Les Secrets déjà synchronisés restent en place ; les CRD sont conservées."
docs: docs/security.md#external-secrets
